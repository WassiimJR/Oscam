name: Build OSCam SF8008 OpenATV 8.0 (Latest Streamboard Patch)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install ARM Cross-Compiler & OpenSSL Headers
        run: |
          apt-get update
          apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf build-essential wget git libssl-dev libpcsclite-dev libusb-1.0-0-dev

      - name: Build Static OpenSSL for ARMhf
        run: |
          wget -q https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_1_1w.tar.gz
          tar -xzf OpenSSL_1_1_1w.tar.gz
          cd openssl-OpenSSL_1_1_1w
          ./Configure linux-armv4 -march=armv7-a -mfpu=neon -mfloat-abi=hard --cross-compile-prefix=arm-linux-gnueabihf- --prefix=/tmp/openssl-armhf no-async no-shared
          make -j$(nproc)
          make install_sw

      - name: Fetch & Apply Latest Streamboard Patch
        run: |
          wget -q "https://git.streamboard.tv/common/oscam/-/commit/39e78a4688b30abaab62b5c9e13672b4e34bfca0.patch" -O streamboard_latest.patch || true
          git apply streamboard_latest.patch 2>/dev/null || patch -p1 < streamboard_latest.patch 2>/dev/null || true

      - name: Compile OSCam Binary
        run: |
          make clean || true
          chmod +x config.sh || true
          ./config.sh --disable CARDREADER_DB2COM WEBIF_SSL || true
          ./config.sh --enable WITH_EMU WITH_SOFTCAM MODULE_STREAMRELAY HAVE_DVBAPI WITH_EXTENDED_CW READER_CRYPTOWORKS || true
          find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/<openssl\/bn.h>/ "cscrypt\/bn.h"/g' {} + || true
          find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/SSLv3_server_method()/TLS_server_method()/g' {} + || true
          make CROSS_DIR=/usr/bin/ \
               CROSS=arm-linux-gnueabihf- \
               USE_SSL=1 \
               USE_LIBCRYPTO=1 \
               EXTRA_FLAGS="-march=armv7-a -mfpu=neon -mfloat-abi=hard -O2 -std=gnu99 -fcommon -Wno-error -Duchar='unsigned char' -I/tmp/openssl-armhf/include" \
               EXTRA_LIBS="-L/tmp/openssl-armhf/lib -lssl -lcrypto -lpthread -ldl -lrt" \
               CONF_DIR=/etc/tuxbox/config/oscam

      - name: Prepare Binary Artifact
        run: |
          mkdir -p bin_out
          find Distribution/ . -maxdepth 2 -name "oscam*" -type f -executable -exec cp {} bin_out/oscam-sf8008-streamboard \;
          ls -lh bin_out/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oscam-sf8008-streamboard
          path: bin_out/oscam-sf8008-streamboard
